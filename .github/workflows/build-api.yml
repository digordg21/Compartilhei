name: Build and Push API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-compartilhei-prod

  REGISTRY: compartilheiacr.azurecr.io
  REGISTRY_NAME: compartilheiacr

  IMAGE_NAME: compartilhei-api

  # NOTE: nome do Container App assumido a partir do IMAGE_NAME; nao confirmado no workflow original.
  CONTAINER_APP_NAME: compartilhei-api

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Azure Login - OIDC
      # ============================================================
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ============================================================
      # Validate Azure subscription
      # ============================================================
      - name: Validate Azure access
        shell: bash
        run: |
          echo "========================================"
          echo "Azure Account"
          echo "========================================"

          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            --output table

          echo ""
          echo "========================================"
          echo "Azure Container Registry"
          echo "========================================"

          az acr show \
            --name "$REGISTRY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name, loginServer:loginServer, sku:sku.name, id:id}" \
            --output table


      # ============================================================
      # Get ACR resource ID
      # ============================================================
      - name: Get ACR resource ID
        shell: bash
        run: |
          ACR_ID=$(az acr show \
            --name "$REGISTRY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)

          echo "ACR_ID=$ACR_ID" >> "$GITHUB_ENV"

          echo "ACR Resource ID:"
          echo "$ACR_ID"


      # ============================================================
      # Validate role assignment
      # ============================================================
      - name: Validate ACR permissions
        shell: bash
        run: |
          echo "========================================"
          echo "ACR Role Assignments"
          echo "========================================"

          echo "Client ID usado pelo Azure Login:"
          echo "${{ secrets.AZURE_CLIENT_ID }}"

          echo ""
          echo "Role assignments found for this identity:"

          az role assignment list \
            --assignee "${{ secrets.AZURE_CLIENT_ID }}" \
            --scope "$ACR_ID" \
            --include-inherited \
            --query "[].{Role:roleDefinitionName,Scope:scope,PrincipalId:principalId}" \
            --output table


      # ============================================================
      # Login into ACR
      # ============================================================
      - name: Login to Azure Container Registry
        shell: bash
        run: |
          echo "Logging into ACR..."

          az acr login \
            --name "$REGISTRY_NAME"


      # ============================================================
      # Validate ACR data-plane access
      # ============================================================
      - name: Validate ACR repository access
        shell: bash
        run: |
          echo "========================================"
          echo "ACR repositories"
          echo "========================================"

          az acr repository list \
            --name "$REGISTRY_NAME" \
            --output table


      # ============================================================
      # Build Docker image
      # ============================================================
      - name: Build Docker image
        shell: bash
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

        run: |
          echo "========================================"
          echo "Docker Build"
          echo "========================================"

          docker build \
            --secret id=sixlabors_license,env=SIXLABORS_LICENSE_KEY \
            --file src/Compartilhei.Api/Dockerfile \
            --tag "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            --tag "$REGISTRY/$IMAGE_NAME:latest" \
            .


      # ============================================================
      # Validate generated image
      # ============================================================
      - name: Validate Docker image
        shell: bash
        run: |
          echo "========================================"
          echo "Docker Images"
          echo "========================================"

          docker images "$REGISTRY/$IMAGE_NAME"


      # ============================================================
      # Push Docker image - SHA
      # ============================================================
      - name: Push Docker image - SHA
        shell: bash
        run: |
          docker push \
            "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"


      # ============================================================
      # Push Docker image - latest
      # ============================================================
      - name: Push Docker image - latest
        shell: bash
        run: |
          docker push \
            "$REGISTRY/$IMAGE_NAME:latest"


      # ============================================================
      # Final output
      # ============================================================
      - name: Show published images
        shell: bash
        run: |
          echo "========================================"
          echo "Published Images"
          echo "========================================"

          echo "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          echo "$REGISTRY/$IMAGE_NAME:latest"

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Azure Login - OIDC
      # ============================================================
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ============================================================
      # Set runtime secrets (Container Apps secret store)
      # NOTE: nome do Container App (compartilhei-api) assumido por
      # convencao com IMAGE_NAME; nao havia job de deploy previo para
      # confirmar. Ajustar CONTAINER_APP_NAME acima se divergir.
      # ============================================================
      - name: Set Container App secrets
        shell: bash
        run: |
          echo "========================================"
          echo "Setting Container App secrets"
          echo "========================================"

          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              sql-connection-string="${{ secrets.SQL_CONNECTION_STRING }}" \
              storage-connection-string="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"


      # ============================================================
      # Deploy new image and inject runtime env vars from secrets
      # ============================================================
      - name: Update Container App
        shell: bash
        run: |
          echo "========================================"
          echo "Updating Container App"
          echo "========================================"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            --set-env-vars \
              ConnectionStrings__DefaultConnection=secretref:sql-connection-string \
              AzureStorage__ConnectionString=secretref:storage-connection-string


      # ============================================================
      # Final output
      # ============================================================
      - name: Show deployed revision
        shell: bash
        run: |
          echo "========================================"
          echo "Deployed Revision"
          echo "========================================"

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.active].{Name:name, Active:properties.active, CreatedTime:properties.createdTime}" \
            --output table