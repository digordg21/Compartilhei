name: Build and Deploy API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-compartilhei-prod

  REGISTRY: compartilheiacr.azurecr.io
  REGISTRY_NAME: compartilheiacr

  IMAGE_NAME: compartilhei-api
  CONTAINER_APP_NAME: compartilhei-api

jobs:

  # ============================================================
  # BUILD + PUSH
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Azure Login - OIDC
      # ----------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------------------
      # Validate Azure
      # ----------------------------------------------------------
      - name: Validate Azure access
        shell: bash
        run: |
          echo "========================================"
          echo "Azure Account"
          echo "========================================"

          az account show \
            --query "{name:name, subscriptionId:id, tenantId:tenantId}" \
            --output table

          echo ""
          echo "========================================"
          echo "Azure Container Registry"
          echo "========================================"

          az acr show \
            --name "$REGISTRY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name, loginServer:loginServer, sku:sku.name}" \
            --output table


      # ----------------------------------------------------------
      # Login to ACR
      # ----------------------------------------------------------
      - name: Login to Azure Container Registry
        shell: bash
        run: |
          az acr login \
            --name "$REGISTRY_NAME"


      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build Docker image
        shell: bash
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

        run: |
          echo "========================================"
          echo "Docker Build"
          echo "========================================"

          docker build \
            --secret id=sixlabors_license,env=SIXLABORS_LICENSE_KEY \
            --file src/Compartilhei.Api/Dockerfile \
            --tag "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            --tag "$REGISTRY/$IMAGE_NAME:latest" \
            .


      # ----------------------------------------------------------
      # Push image - SHA
      # ----------------------------------------------------------
      - name: Push Docker image - SHA
        shell: bash
        run: |
          docker push \
            "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"


      # ----------------------------------------------------------
      # Push image - latest
      # ----------------------------------------------------------
      - name: Push Docker image - latest
      shell: bash
      run: |
        docker push \
          "$REGISTRY/$IMAGE_NAME:latest"


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Azure Login - OIDC
      # ----------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------------------
      # Set Container App secrets
      # ----------------------------------------------------------
      - name: Set Container App secrets
        shell: bash
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

        run: |
          echo "========================================"
          echo "Setting Container App secrets"
          echo "========================================"

          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              sql-connection-string="$SQL_CONNECTION_STRING" \
              storage-connection-string="$AZURE_STORAGE_CONNECTION_STRING"


      # ----------------------------------------------------------
      # Update Container App
      # ----------------------------------------------------------
      - name: Update Container App
        shell: bash
        run: |
          echo "========================================"
          echo "Updating Container App"
          echo "========================================"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            --set-env-vars \
              ConnectionStrings__DefaultConnection=secretref:sql-connection-string \
              AzureStorage__ConnectionString=secretref:storage-connection-string


      # ----------------------------------------------------------
      # Show deployed revision
      # ----------------------------------------------------------
      - name: Show deployed revision
        shell: bash
        run: |
          echo "========================================"
          echo "Deployed Revision"
          echo "========================================"

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.active].{Name:name, Active:properties.active, CreatedTime:properties.createdTime}" \
            --output table